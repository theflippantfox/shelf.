<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7B4F8A" />
    <!-- PWA -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shëlf" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <!-- Register the service worker after the page loads.
         Generated by @vite-pwa/sveltekit (autoUpdate strategy). -->
    <script>
      // Only register the service worker if it's served at /sw.js.
      // vite-plugin-pwa doesn't emit the SW in dev (so /sw.js 404s
      // and we'd just be logging a noisy warning) — in production
      // the SW is built and reachable.
      if ('serviceWorker' in navigator) {
        addEventListener('load', async () => {
          try {
            const res = await fetch('/sw.js', { method: 'HEAD' });
            if (!res.ok) return;  // SW not built (dev) — skip silently.
            await navigator.serviceWorker.register('/sw.js', { type: 'module' });
          } catch (err) {
            console.warn('[pwa] SW registration failed:', err);
          }
        });
      }
    </script>
    %sveltekit.head%
  </head>
  <body class="h-full" data-sveltekit-preload-data="hover">
    <script>
      try {
        const t = localStorage.getItem('shelf-theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        const c = localStorage.getItem('shelf-primary-color');
        const s = localStorage.getItem('shelf-sidebar-bg');
        if (c) document.documentElement.style.setProperty('--primary', c);
        if (s) document.documentElement.style.setProperty('--sidebar-bg', s);
      } catch(e) {}

      // Browser-specific perf hint.
      // Firefox is much slower than Chromium at filter:blur() and
      // backdrop-filter — both of which are present on the auth and
      // welcome pages, and on the bottom nav. Adding a class to <html>
      // lets the CSS drop these effects on Firefox, restoring
      // smoothness on the same hardware.
      try {
        const ua = navigator.userAgent;
        if (/Firefox\/\d+/.test(ua) && !/Seamonkey/.test(ua)) {
          document.documentElement.classList.add('is-firefox');
        } else if (/Edg\//.test(ua)) {
          document.documentElement.classList.add('is-edge');
        }
        // Honour the OS reduced-motion preference.
        if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('reduce-motion');
        }
      } catch(e) {}

      document.documentElement.classList.add('theme-loaded');
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
