# docker-compose.yml — Shëlf production stack
# ─────────────────────────────────────────────────────────────────────
# The Supabase backend runs as a managed cloud service (not in this
# compose file). This file only contains the app + reverse proxy + DNS.
#
# Required env vars (in .env.production):
#   - PUBLIC_SUPABASE_URL       (e.g. https://abc.supabase.co)
#   - PUBLIC_SUPABASE_ANON_KEY
#   - SUPABASE_SERVICE_ROLE_KEY
#   - DUCKDNS_SUBDOMAIN
#   - DUCKDNS_TOKEN
# ─────────────────────────────────────────────────────────────────────

services:

  shelf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
    container_name: shelf_app
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV:             production
      PORT:                 "3000"
      PUBLIC_SUPABASE_URL:  ${PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - shelf_net

  nginx:
    image: nginx:1.25-alpine
    container_name: shelf_nginx
    restart: unless-stopped
    depends_on:
      - shelf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - shelf_net

  certbot:
    image: certbot/certbot:latest
    container_name: shelf_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: shelf_duckdns
    restart: unless-stopped
    env_file: .env.production
    environment:
      PUID:       "1000"
      PGID:       "1000"
      TZ:         "Africa/Lagos"
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN:      ${DUCKDNS_TOKEN}
      LOG_FILE:   "false"
    volumes:
      - duckdns_config:/config

volumes:
  certbot_www:
  certbot_certs:
  duckdns_config:

networks:
  shelf_net:
    driver: bridge
